name: Publish CLI to npm
on:
  push:
    tags: ["cli-v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check bin/wunderui.mjs && node --check src/index.mjs && node bin/wunderui.mjs --help > /dev/null
      # npm Trusted Publishing: no token, provenance is automatic (no registry-url above: it would set a placeholder token)
      - name: Publish
        run: |
          npm install -g npm@latest
          set +e
          npm publish --access public > publish.log 2>&1
          code=$?
          cat publish.log
          if [ $code -ne 0 ]; then grep -E "npm error|ERR" publish.log | head -8 | while read -r l; do echo "::error::$l"; done; exit $code; fi
